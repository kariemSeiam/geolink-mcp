# ── GeoLink MCP Server — geo-mcp.kariem.dev ──────────────────────────────────
# Place this file at: /etc/nginx/conf.d/geo-mcp.kariem.dev.conf
# (or via CyberPanel vhost custom config)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name geo-mcp.kariem.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name geo-mcp.kariem.dev;

    # ── SSL (Let's Encrypt via CyberPanel) ────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/geo-mcp.kariem.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo-mcp.kariem.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         DENY    always;
    add_header Referrer-Policy         no-referrer always;

    # ── Rate limiting (prevents API key abuse) ────────────────────────────────
    limit_req_zone $binary_remote_addr zone=geolink_mcp:10m rate=30r/m;
    limit_req zone=geolink_mcp burst=10 nodelay;

    # ── Proxy to Docker container ─────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;

        # ── Streaming support (SSE / Streamable HTTP) ─────────────────────────
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;

        # ── CORS (allow Claude.ai, any MCP client) ────────────────────────────
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, MCP-Session-Id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── Health check (no rate limit, direct) ─────────────────────────────────
    location = /healthz {
        proxy_pass http://127.0.0.1:3010/healthz;
        limit_req  off;
        access_log off;
    }
}
