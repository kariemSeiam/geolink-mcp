# Mounting GeoLink MCP on the main site, at /mcp
#
# The MCP server runs as its own Node process on 127.0.0.1:3000 while Flask
# keeps serving everything else. Only the paths below are handed to it, so the
# site is untouched by the merge.
#
# Five locations, and each one is here for a reason:
#
#   /mcp            the protocol endpoint itself
#   /mcp/           the authorization endpoints, namespaced under the mount so
#                   /register cannot collide with the site's own sign-up page
#   /.well-known/oauth-protected-resource      RFC 9728 puts it at the root and
#   /.well-known/oauth-protected-resource/mcp  a client looks nowhere else
#   /.well-known/oauth-authorization-server    RFC 8414, same reason
#
# Neither well-known path collides with anything the site serves.
#
# Drop this inside the existing `server { }` block for the domain, before the
# SPA fallback location, and reload.

# --- the protocol endpoint ---------------------------------------------------
location = /mcp {
    proxy_pass         http://127.0.0.1:3000/mcp;
    proxy_http_version 1.1;

    # Streamable HTTP answers some requests as an event stream. Without these
    # four lines the stream sits in nginx's buffer and the client waits through
    # its whole timeout for a response that has already been written.
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    chunked_transfer_encoding on;
    proxy_read_timeout 300s;

    proxy_set_header   Host              $host;
    # The metadata this server publishes has to name the host the client typed,
    # not 127.0.0.1. These two headers are how it knows the difference.
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

    # An unauthenticated call is answered with a challenge naming where to
    # authenticate. A proxy that drops it turns a recoverable 401 into a dead end.
    proxy_pass_header  WWW-Authenticate;
}

# --- authorization endpoints, and the consent page ---------------------------
location ^~ /mcp/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_pass_header  WWW-Authenticate;
}

# --- discovery documents, which the RFCs place at the root -------------------
location ^~ /.well-known/oauth-protected-resource {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
}

location = /.well-known/oauth-authorization-server {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
}

# ---------------------------------------------------------------------------
# Running the process
#
#   GEOLINK_PUBLIC_URL=https://geolink-eg.com \
#   TRANSPORT=http HOST=127.0.0.1 PORT=3000 \
#   node dist/index.js
#
# GEOLINK_API_KEY is deliberately unset: over HTTP every connection carries its
# own key from the authorization flow, so the process holds no credential of
# its own and one deployment serves everyone against their own account.
#
# On the dev host the only change is the public URL:
#
#   GEOLINK_PUBLIC_URL=https://dev.geolink-eg.com
#
# Set it explicitly on both. The forwarded headers are the fallback, and if a
# layer above strips them the metadata quietly starts advertising an internal
# address that no client can reach.
#
# Verify after a reload, against either host:
#
#   curl -s https://geolink-eg.com/.well-known/oauth-protected-resource/mcp | jq
#   curl -si -X POST https://geolink-eg.com/mcp -d '{}' | grep -i www-authenticate
#
# The first must report `"resource": "https://geolink-eg.com/mcp"`. The second
# must carry a challenge pointing back at that same document. If either names
# 127.0.0.1, the forwarded headers are not arriving.
